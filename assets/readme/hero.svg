<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">山河入版 Shanhe Gallery — 185 张套色木刻风格原创 AI 画作</title>
  <desc id="desc">暖纸底标题：山河入版；右侧是套色木刻风格的层叠青山，红日当空，右下角一枚红色山河印章。</desc>

  <rect width="1200" height="360" rx="26" fill="#faf6ef"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#8c2d23">MULTICOLOR WOODCUT · 185 ORIGINAL WORKS</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#1c1917">山河入版</text>
    <text x="56" y="168" font-size="23" fill="#292524">185 张套色木刻风格原创 AI 画作</text>
    <text x="56" y="204" font-size="19" fill="#57534e">山河、名胜、生活、节庆、海外风光与十一城五景。</text>
    <g id="chips" font-size="18" fill="#292524" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/><text x="119" y="262">185 张画作</text></g>
      <g><rect x="194" y="238" width="108" height="36" rx="18" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/><text x="248" y="262">22 个分类</text></g>
      <g><rect x="314" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/><text x="377" y="262">十一城五景</text></g>
      <g><rect x="452" y="238" width="132" height="36" rx="18" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/><text x="518" y="262">灯箱 + 下载</text></g>
    </g>
  </g>

  <g id="mountains-motif">
    <rect x="800" y="60" width="340" height="240" fill="#e8f0ec"/>
    <circle cx="1080" cy="102" r="22" fill="#c2410c"/>
    <polygon points="800,180 860,130 920,165 980,120 1040,160 1100,130 1140,155 1140,300 800,300" fill="#a8d5cd"/>
    <polygon points="800,220 870,170 930,205 1000,165 1070,210 1140,180 1140,300 800,300" fill="#5fa8a0"/>
    <polygon points="800,260 880,210 950,250 1020,215 1090,255 1140,235 1140,300 800,300" fill="#2d7a6e"/>
    <g id="pines" fill="#1d4a3a">
      <polygon points="840,262 852,228 864,262"/>
      <polygon points="920,268 932,234 944,268"/>
      <polygon points="1000,262 1012,226 1024,262"/>
    </g>
    <g id="seal" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <rect x="1088" y="248" width="46" height="46" rx="4" fill="#b91c1c"/>
      <text x="1111" y="279" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">山河</text>
    </g>
  </g>
</svg>
